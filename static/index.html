<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くらし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">くらし</div>
  <div class="clock">
    <div class="clock-main"><span id="clock-hm">--:--</span><span id="clock-s" class="clock-s">:--</span></div>
    <div class="clock-date" id="clock-date"></div>
  </div>
  <span class="chip phase" id="phase-chip">—</span>
  <span class="chip weather" id="weather-chip" title="今日の天気（外の人の多さが変わる）"></span>
  <span class="chip home" id="home-chip" title="誰と暮らしているか・いまそばに誰がいるか"></span>
  <div class="spacer"></div>
  <select id="world-select" class="char-select" title="ワールド切替（作成・名前変更・削除は 設定 → データ）"></select>
  <select id="char-select" class="char-select" title="誰と（コマンド欄の「〇〇と」で選ぶ）"></select>
  <button class="btn ghost" id="btn-manual" title="説明書">📖 <span class="lbl">説明書</span></button>
  <button class="btn ghost" id="btn-gallery" title="ギャラリー">🖼 <span class="lbl">ギャラリー</span></button>
  <button class="btn ghost" id="btn-settings" title="設定">⚙ <span class="lbl">設定</span></button>
</header>

<main class="layout">
  <section class="stage" id="stage">
    <div class="stage-bg" id="stage-bg"></div>
    <img class="stage-img" id="stage-img" alt="">
    <div class="stage-empty" id="stage-empty">
      <div class="empty-icon">🌙</div>
      <div>まだ画像がありません</div>
      <small>コマンドを実行すると ComfyUI で生成します</small>
    </div>
    <div class="stage-top">
      <span class="chip scene" id="scene-chip">—</span>
      <button class="gen-badge" id="gen-badge" title="クリックで生成ジョブの詳細"></button>
    </div>
    <div class="stage-tools">
      <button class="btn icon" id="btn-dlg" title="会話欄を隠す／出す（H キー・画像クリックでも）">💬</button>
      <button class="btn icon" id="btn-reroll" title="同じプロンプトの別の画像を表示">🎲</button>
      <button class="btn icon" id="btn-regen" title="この場面を新しく生成">⟳</button>
      <button class="btn icon" id="btn-snap" title="今の様子を撮る">📷</button>
      <button class="btn icon" id="btn-prompt" title="プロンプトを見る・編集">🧩</button>
    </div>
    <div class="dialogue" id="dialogue">
      <div class="nameplate" id="nameplate"></div>
      <div class="dtext" id="dtext"></div>
      <div class="dmeta"><span id="dtime"></span><span class="deltas" id="deltas"></span></div>
    </div>
  </section>

  <aside class="side">
    <div class="who">
      <div class="who-face" id="who-face">🙂</div>
      <div class="who-body">
        <div class="who-name" id="who-name">—</div>
        <div class="who-scene" id="who-scene"></div>
        <div class="tags" id="who-tags"></div>
      </div>
    </div>
    <div class="approach-box" id="approach-box" hidden></div>
    <div class="request-box" id="request-box" hidden></div>
    <div class="request-box" id="encounter-box" hidden></div>
    <div class="request-box street-box" id="street-box" hidden></div>
    <nav class="tabs" id="tabs">
      <button data-tab="commands" class="on">コマンド</button>
      <button data-tab="dress">着せ替え</button>
      <button data-tab="games">ゲーム</button>
      <button data-tab="money">お金</button>
      <button data-tab="status">ステータス</button>
      <button data-tab="log">ログ</button>
    </nav>
    <div class="tab-body" id="tab-commands"></div>
    <div class="tab-body" id="tab-dress" hidden></div>
    <div class="tab-body" id="tab-games" hidden></div>
    <div class="tab-body" id="tab-money" hidden></div>
    <div class="tab-body" id="tab-status" hidden></div>
    <div class="tab-body" id="tab-log" hidden></div>
  </aside>
</main>

<div class="away-overlay" id="away-overlay" hidden></div>

<dialog class="modal task-dlg" id="task-dlg">
  <div class="modal-head"><b>内職</b><span class="muted small" id="task-sub"></span><div class="spacer"></div><button class="btn ghost" id="task-close">✕</button></div>
  <div class="task-body" id="task-body"></div>
</dialog>

<div class="drawer" id="prompt-drawer" hidden>
  <div class="drawer-head">
    <b>プロンプト</b><span class="muted" id="pd-src"></span>
    <div class="spacer"></div>
    <button class="btn ghost" id="pd-close">✕</button>
  </div>
  <div class="drawer-body">
    <div class="parts" id="pd-parts"></div>
    <label class="fld"><span class="fl">Positive</span><textarea id="pd-pos" rows="4"></textarea></label>
    <label class="fld"><span class="fl">Negative</span><textarea id="pd-neg" rows="3"></textarea></label>
    <div class="row">
      <label class="fld inline"><span class="fl">Seed</span><input id="pd-seed" type="number" placeholder="空欄でランダム"></label>
      <div class="spacer"></div>
      <button class="btn ghost" id="pd-load">今の状態から組み立て</button>
      <button class="btn" id="pd-regen">この記録で生成</button>
      <button class="btn primary" id="pd-new">新しい記録として生成</button>
    </div>
  </div>
</div>

<div class="drawer" id="jobs-panel" hidden>
  <div class="drawer-head">
    <b>生成ジョブ</b><span class="muted small" id="jp-worker"></span>
    <div class="spacer"></div>
    <button class="btn ghost" id="jp-test" title="ComfyUI 接続テスト">接続テスト</button>
    <button class="btn ghost danger" id="jp-cancel-all">待ちを全部取消</button>
    <button class="btn ghost" id="jp-close">✕</button>
  </div>
  <div class="drawer-body" id="jp-body"></div>
</div>

<dialog class="modal" id="settings-dlg">
  <div class="modal-head"><b>設定</b><div class="spacer"></div><button class="btn ghost" data-close>✕</button></div>
  <div class="settings">
    <nav class="snav" id="snav">
      <button data-sec="player">あなた</button>
      <button data-sec="char" class="on">キャラクター</button>
      <button data-sec="personas">性格・セリフ集</button>
      <button data-sec="schedule">生活スケジュール</button>
      <button data-sec="wardrobe">着せ替え</button>
      <button data-sec="actions">コマンド</button>
      <button data-sec="minigames">ミニゲーム</button>
      <button data-sec="events">キャラの出来事</button>
      <button data-sec="approaches">キャラからの働きかけ</button>
      <button data-sec="params">パラメータ</button>
      <button data-sec="comfy">画像生成 (ComfyUI)</button>
      <button data-sec="prompt">共通プロンプト・時間帯</button>
      <button data-sec="llm">セリフ生成 (LLM)</button>
      <button data-sec="display">表示</button>
      <button data-sec="data">データ</button>
    </nav>
    <div class="sbody" id="sbody"></div>
  </div>
</dialog>

<dialog class="modal" id="gallery-dlg">
  <div class="modal-head"><b>ギャラリー</b><span class="muted" id="gal-count"></span><div class="spacer"></div>
    <div class="seg" id="gal-mode"><button data-mode="time" class="on">時系列</button><button data-mode="prompt">シチュエーション別</button></div><button class="btn ghost" data-close>✕</button></div>
  <div class="gallery" id="gallery"></div>
  <div class="center"><button class="btn ghost" id="gal-more" hidden>もっと見る</button></div>
</dialog>

<dialog class="modal manual-dlg" id="manual-dlg">
  <div class="modal-head"><b>説明書</b><div class="spacer"></div>
    <a class="btn ghost" id="manual-tab" href="/static/manual.html" target="_blank">新しいタブで開く ↗</a>
    <button class="btn ghost" data-close>✕</button></div>
  <iframe id="manual-frame" title="説明書"></iframe>
</dialog>

<dialog class="lightbox" id="lightbox">
  <img id="lb-img" alt="">
  <div class="lb-info">
    <div class="lb-text" id="lb-text"></div>
    <div class="muted small" id="lb-meta"></div>
    <details><summary>プロンプト</summary><pre id="lb-prompt"></pre></details>
    <div class="row"><button class="btn" id="lb-stage">ステージに表示</button><a class="btn ghost" id="lb-open" target="_blank">原寸で開く</a><button class="btn ghost danger" id="lb-delete">この画像を消す</button><div class="spacer"></div><button class="btn ghost" data-close>閉じる</button></div>
  </div>
</dialog>

<div class="toasts" id="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
