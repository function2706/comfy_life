<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ミニゲーム（単独版）</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); }
  .lab { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .lab h1 { font-size: 18px; margin: 0; }
  .lab-games { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .lab-games .game-card { margin-bottom: 8px; }
  #toasts { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 9; }
</style>
</head>
<body>
<div class="lab">
  <div class="row"><h1>🎲 ミニゲーム（単独版）</h1><div class="spacer"></div><span class="muted small">セリフ・画像なし。本体のデータには触れません</span></div>
  <div class="lab-games" id="tab-games"></div>
</div>
<div id="toasts"></div>
<script src="/static/minigames.js"></script>  <!-- 関数だけなので先に読む (下の道具は呼ぶときに使う) -->
<script>
'use strict';
// static/minigames.js が使う道具 (本体の app.js と同じ形)
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let value;
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'value') value = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'checked' || k === 'disabled') el[k] = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  if (value !== undefined) el.value = value;
  return el;
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: 'HTTP ' + r.status }));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function toast(msg, kind = '') {
  const t = h('div', { class: 'toast ' + kind }, msg);
  $('#toasts').append(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6000 : 2500);
}
const S = { view: null, busy: false, gameHint: null, gameResult: null };

// 操作を送って描き直す (セリフ・ヒントは出さない. 勝ち負けだけ)
async function gameAct(path, body) {
  if (S.busy) return;
  S.busy = true;
  renderGames();
  try {
    const r = await api(path, body);
    S.view = r.view;
    S.gameResult = r.ended === 'win' ? '🎉 あなたの勝ち！' : r.ended === 'lose' ? '😵 あなたの負け…' : r.ended === 'draw' ? '引き分け' : null;
  } catch (e) {
    toast(e.message, 'err');
  } finally {
    S.busy = false;
    renderGames();
  }
}
(async () => {
  try { S.view = await api('/api/state'); } catch (e) { toast(e.message, 'err'); return; }
  renderGames();
})();
</script>
</body>
</html>
